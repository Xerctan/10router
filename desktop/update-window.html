<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>10Router</title>
<style>
/* 设计 token 直抄仪表盘唯一真源 src/app/globals.css(:root / .dark 两节) */
:root {
  --brand-500: #E56A4A;
  --brand-600: #cc5236;
  --brand-700: #a64027;
  --bg: #FDFAF6;
  --surface: #ffffff;
  --surface-2: #f4f4f5;
  --border-subtle: #f1f1f3;
  --text-main: #0a0a0a;
  --text-muted: #6B7280;
  --success: #10B981;
  --danger: #cf222e;
  --shadow-soft: 0 1px 2px 0 rgba(0,0,0,0.04);
  --shadow-elev: inset 0 1px 0 0 rgba(255,255,255,0.8), 0 1px 2px rgba(15,23,42,0.04), 0 12px 36px -8px rgba(15,23,42,0.10);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1a1a;
    --surface: #262626;
    --surface-2: #303030;
    --border-subtle: #2a2a2a;
    --text-main: #ededed;
    --text-muted: #9ca3af;
    --success: #22c55e;
    --danger: #ef4444;
    --shadow-soft: 0 1px 2px 0 rgba(0,0,0,0.3);
    --shadow-elev: inset 0 1px 0 0 rgba(255,255,255,0.06), 0 1px 2px rgba(0,0,0,0.4), 0 16px 48px -8px rgba(0,0,0,0.55);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  /* --font-sans(globals.css:199),CJK 回退追加在后 */
  font: 13px/1.55 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text-main);
  user-select: none;
  -webkit-user-select: none;
}
svg.ic { fill: currentColor; display: block; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
.titlebar {
  display: flex; align-items: center; justify-content: space-between;
  height: 38px; padding: 0 6px 0 14px;
  -webkit-app-region: drag;
}
.titlebar .brand { font-size: 12px; font-weight: 600; color: var(--text-muted); letter-spacing: .02em; }
#closeBtn {
  -webkit-app-region: no-drag;
  width: 30px; height: 30px; border: 0; border-radius: 10px;  /* Modal X:p-1.5 rounded-[10px] */
  background: transparent; color: var(--text-muted);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background .15s ease-out, color .15s ease-out;
}
#closeBtn:hover { background: var(--surface-2); color: var(--text-main); }
#closeBtn svg { width: 18px; height: 18px; }
.card {
  /* Card/Modal:rounded-[14px] border-subtle shadow-elev */
  margin: 4px 12px 12px;
  padding: 18px 18px 16px;
  background: var(--surface);
  border: 1px solid var(--border-subtle);
  border-radius: 14px;
  box-shadow: var(--shadow-elev);
  display: flex; flex-direction: column; gap: 10px;
}
.iconRow { display: flex; align-items: center; gap: 12px; }
/* Card.js 图标位:p-2 rounded-[10px],状态配色用餐盘 Badge 的 /10 色调 */
.tile {
  width: 40px; height: 40px; flex: none; border-radius: 10px;
  display: none; align-items: center; justify-content: center;
}
.tile svg { width: 22px; height: 22px; }
.tile.brand { background: rgba(229, 106, 74, .12); color: var(--brand-500); }
.tile.ok { background: rgba(16, 185, 129, .14); color: var(--success); }
.tile.err { background: rgba(239, 68, 68, .12); color: var(--danger); }
.spinWrap { width: 40px; height: 40px; flex: none; display: none; align-items: center; justify-content: center; color: var(--brand-500); }
.spinWrap svg { width: 24px; height: 24px; animation: dashSpin .9s linear infinite; }  /* Loading.js Spinner:animate-spin text-brand-500 */
@keyframes dashSpin { to { transform: rotate(360deg); } }
#title { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.35; color: var(--text-main); }
#version {
  /* Badge.js primary:bg-brand-500/10 text-brand-600 dark:text-brand-300 */
  display: none; align-self: flex-start;
  padding: 2px 10px; border-radius: 999px;
  background: rgba(229, 106, 74, .1); color: var(--brand-600);
  font-size: 12px; font-weight: 600;
}
@media (prefers-color-scheme: dark) {
  #version { color: #ee8d6a; }  /* brand-300 */
}
#body { margin: 0; font-size: 13px; color: var(--text-muted); white-space: pre-line; }
#fileName {
  display: none; font-size: 11px; color: var(--text-muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#progress { display: none; flex-direction: column; gap: 6px; }
.bar { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
#barFill {
  height: 100%; width: 0; border-radius: 999px;
  background: linear-gradient(90deg, var(--brand-500), var(--brand-700));  /* Sidebar 品牌渐变角标同款 */
  transition: width .18s ease-out;
}
#barFill.indet { width: 40% !important; animation: slide 1.1s ease-in-out infinite; }
@keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
#progressText { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
#buttons { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; margin-top: 4px; }
#buttons:empty { display: none; }
/* Button.js md:h-9 px-4 text-sm rounded-[10px] font-semibold;ghost 为默认形态 */
#buttons button {
  height: 36px; padding: 0 16px; font-size: 14px; font-weight: 600; border-radius: 10px;
  display: inline-flex; align-items: center; gap: 8px;
  border: 0; background: transparent; color: var(--text-muted); cursor: pointer;
  transition: all .15s ease-out;
}
#buttons button:hover { background: var(--surface-2); color: var(--text-main); }
#buttons button:active { transform: scale(.97); }  /* active:scale-[0.97] */
#buttons button.primary {
  background: var(--brand-500); color: #fff;
  box-shadow: var(--shadow-soft);
}
#buttons button.primary:hover { background: var(--brand-600); color: #fff; }
#buttons button svg { width: 18px; height: 18px; }
</style>
</head>
<body>
<!-- 图标:Material Symbols 24px outlined 官方 path,内联 symbol 精灵,无字体无外链 -->

  <symbol id="i-error" viewBox="0 -960 960 960"><path d="M508.5-291.5Q520-303 520-320t-11.5-28.5Q497-360 480-360t-28.5 11.5Q440-337 440-320t11.5 28.5Q463-280 480-280t28.5-11.5ZM440-440h80v-240h-80v240Zm40 360q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z"/></symbol>
  <symbol id="i-progress" viewBox="0 -960 960 960"><path d="M325-111.5q-73-31.5-127.5-86t-86-127.5Q80-398 80-480.5t31.5-155q31.5-72.5 86-127t127.5-86Q398-880 480-880q17 0 28.5 11.5T520-840q0 17-11.5 28.5T480-800q-133 0-226.5 93.5T160-480q0 133 93.5 226.5T480-160q133 0 226.5-93.5T800-480q0-17 11.5-28.5T840-520q17 0 28.5 11.5T880-480q0 82-31.5 155t-86 127.5q-54.5 54.5-127 86T480.5-80Q398-80 325-111.5Z"/></symbol>
  <symbol id="i-refresh" viewBox="0 -960 960 960"><path d="M480-160q-134 0-227-93t-93-227q0-134 93-227t227-93q69 0 132 28.5T720-690v-110h80v280H520v-80h168q-32-56-87.5-88T480-720q-100 0-170 70t-70 170q0 100 70 170t170 70q77 0 139-44t87-116h84q-28 106-114 173t-196 67Z"/></symbol>
  <symbol id="i-open-in-new" viewBox="0 -960 960 960"><path d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h280v80H200v560h560v-280h80v280q0 33-23.5 56.5T760-120H200Zm188-212-56-56 372-372H560v-80h280v280h-80v-144L388-332Z"/></symbol>
  <symbol id="i-close" viewBox="0 -960 960 960"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></symbol>
</svg>
<div class="titlebar">
  <span class="brand" id="brand">10Router</span>
  <button id="closeBtn" aria-label="close"><svg class="ic"><use href="#i-close"/></svg></button>
</div>
<div class="card">
  <div class="iconRow">
    <div class="spinWrap" id="spinWrap"><svg class="ic spin"><use href="#i-progress"/></svg></div>
    <div class="tile" id="tile"><svg class="ic"><use id="stateUse" href="#i-download"/></svg></div>
    <h1 id="title"></h1>
  </div>
  <span id="version"></span>
  <p id="body"></p>
  <div id="progress">
    <div id="fileName"></div>
    <div class="bar"><div id="barFill"></div></div>
    <div id="progressText"></div>
  </div>
  <div id="buttons"></div>
</div>
<script>
(function () {
  'use strict';
  var api = window.updateApi;
  var $ = function (id) { return document.getElementById(id); };
  var strings = {};

  // 状态 → 图标/色调(checking 走旋转 spinner,不进此表)
  var STATE_ICON = {
    available: { icon: 'i-download', tone: 'brand' },
    downloading: { icon: 'i-download', tone: 'brand' },
    ready: { icon: 'i-check-circle', tone: 'ok' },
    latest: { icon: 'i-check-circle', tone: 'ok' },
    error: { icon: 'i-error', tone: 'err' },
  };
  var SVGNS = 'http://www.w3.org/2000/svg';

  function fit() {
    requestAnimationFrame(function () {
      api.fitHeight(Math.ceil(document.body.getBoundingClientRect().height));
    });
  }

  function fmtMb(n) { return (n / 1048576).toFixed(1); }

  function addBtn(label, action, opts) {
    opts = opts || {};
    var b = document.createElement('button');
    if (opts.primary) b.className = 'primary';
    if (opts.icon) {
      var svg = document.createElementNS(SVGNS, 'svg');
      svg.setAttribute('class', 'ic');
      var use = document.createElementNS(SVGNS, 'use');
      use.setAttribute('href', '#' + opts.icon);
      svg.appendChild(use);
      b.appendChild(svg);
    }
    b.appendChild(document.createTextNode(label));
    b.addEventListener('click', function () { api.action(action); });
    $('buttons').appendChild(b);
  }

  function render(view) {
    if (!view || !view.state) return;
    var st = view.state;
    var meta = STATE_ICON[st] || null;
    $('spinWrap').style.display = st === 'checking' ? 'flex' : 'none';
    var tile = $('tile');
    if (meta) {
      $('stateUse').setAttribute('href', '#' + meta.icon);
      tile.setAttribute('class', 'tile ' + meta.tone);
      tile.style.display = 'flex';
    } else {
      tile.style.display = 'none';
    }

    $('title').textContent = view.title || '';
    var ver = $('version');
    if (st === 'available' && view.version) {
      ver.textContent = 'v' + view.version;
      ver.style.display = 'inline-block';
    } else {
      ver.style.display = 'none';
    }
    var bodyEl = $('body');
    bodyEl.textContent = view.body || view.detail || '';
    bodyEl.style.display = bodyEl.textContent ? 'block' : 'none';

    var prog = $('progress');
    if (st === 'downloading') {
      prog.style.display = 'flex';
      $('fileName').textContent = view.file || '';
      $('fileName').style.display = view.file ? 'block' : 'none';
      var got = Number(view.got) || 0;
      var total = Number(view.total) || 0;
      var fill = $('barFill');
      if (total > 0) {
        var pct = Math.min(100, Math.round((got / total) * 100));
        fill.classList.remove('indet');
        fill.style.width = pct + '%';
        $('progressText').textContent = pct + '% · ' + fmtMb(got) + ' / ' + fmtMb(total) + ' MB';
      } else {
        fill.classList.add('indet');
        $('progressText').textContent = fmtMb(got) + ' MB';
      }
    } else {
      prog.style.display = 'none';
    }

    var btns = $('buttons');
    btns.textContent = '';
    if (st === 'latest') {
      addBtn(strings.ok, 'close', { primary: true });
    } else if (st === 'available' && view.mode === 'download') {
      addBtn(strings.downloadInstall, 'download', { primary: true, icon: 'i-download' });
      addBtn(strings.openReleases, 'open-releases', { icon: 'i-open-in-new' });
      addBtn(strings.later, 'close');
    } else if (st === 'available') {
      addBtn(strings.openReleases, 'open-releases', { primary: true, icon: 'i-open-in-new' });
      addBtn(strings.later, 'close');
    } else if (st === 'downloading') {
      addBtn(strings.cancel, 'cancel');
    } else if (st === 'ready') {
      addBtn(view.installLabel || 'Install', 'install', { primary: true });
      addBtn(strings.later, 'close');
    } else if (st === 'error') {
      addBtn(strings.retry, 'retry', { primary: true, icon: 'i-refresh' });
      addBtn(strings.openReleases, 'open-releases', { icon: 'i-open-in-new' });
      addBtn(strings.close, 'close');
    }
    fit();
  }

  $('closeBtn').addEventListener('click', function () { api.action('close'); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') api.action('close'); });
  if (window.ResizeObserver) new ResizeObserver(fit).observe(document.body);
  api.onState(function (view) { render(view); fit(); });
  api.bootstrap().then(function (boot) {
    if (!boot) return;
    strings = boot.strings || {};
    $('brand').textContent = strings.windowTitle || '10Router';
    document.title = strings.windowTitle || '10Router';
    render(boot.view);
    fit();
  });
})();
</script>
</body>
</html>
